<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting - Guillermo Sahonero</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var section = path.replace(/^\/+|\/+$/g, '');
        var knownSections = ['home', 'bio', 'publications', 'teaching', 'contact'];
        if (knownSections.indexOf(section) !== -1) {
          window.location.replace('/#' + section);
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 20vh; color: #64748b;">
      Redirecting to section... <a href="/">Click here if not redirected</a>.
    </p>
  </body>
</html>
