<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.25"/>

  <!-- Document Sheet -->
  <path d="M128 96 H304 L384 176 V416 C384 429.255 373.255 440 360 440 H128 C114.745 440 104 429.255 104 416 V120 C104 106.745 114.745 96 128 96 Z" fill="url(#docGrad)" filter="url(#glow)"/>

  <!-- Fold Corner -->
  <path d="M304 96 V160 C304 168.837 311.163 176 320 176 H384 L304 96 Z" fill="url(#foldGrad)"/>

  <!-- Document Lines (CV Sections) -->
  <!-- Header Avatar / Badge -->
  <circle cx="160" cy="168" r="24" fill="#ffffff" opacity="0.95"/>
  <rect x="200" y="152" width="80" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
  <rect x="200" y="172" width="60" height="10" rx="5" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Section 1 Divider -->
  <rect x="144" y="216" width="224" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Section 1 Content -->
  <rect x="144" y="236" width="160" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="320" y="236" width="48" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="144" y="254" width="224" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="144" y="268" width="180" height="8" rx="4" fill="#ffffff" opacity="0.5"/>

  <!-- Section 2 Divider -->
  <rect x="144" y="300" width="224" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Section 2 Content -->
  <rect x="144" y="320" width="140" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="300" y="320" width="68" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="144" y="338" width="224" height="8" rx="4" fill="#ffffff" opacity="0.5"/>

  <!-- Database & Compiler Badge -->
  <g transform="translate(320, 320)">
    <circle cx="48" cy="48" r="38" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="5"/>
    <path d="M34 40 L24 48 L34 56 M62 40 L72 48 L62 56 M51 36 L45 60" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
